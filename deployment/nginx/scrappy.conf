# Configuración Nginx para Scrappy
# Este archivo será copiado a /etc/nginx/sites-available/

# Caché de respuestas upstream
proxy_cache_path /var/cache/nginx/scrappy levels=1:2 keys_zone=scrappy_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Límite de tasa para prevenir abuso
limit_req_zone $binary_remote_addr zone=scrappy_limit:10m rate=10r/s;

# Redirigir www a no-www
server {
    listen 80;
    listen [::]:80;
    server_name www.your-domain.com;
    return 301 $scheme://your-domain.com$request_uri;
}

# Servidor principal
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Logs
    access_log /var/log/nginx/scrappy_access.log;
    error_log /var/log/nginx/scrappy_error.log;

    # Tamaño máximo de cuerpo de petición
    client_max_body_size 10M;

    # Seguridad headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Archivos estáticos con caché
    location /static/ {
        alias /home/azureuser/scrappy/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Endpoint de scraping con límite de tasa y caché
    location /api/scrape {
        limit_req zone=scrappy_limit burst=5 nodelay;

        # Caché de 5 minutos para reducir carga
        proxy_cache scrappy_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts aumentados para scraping
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Exportación CSV sin caché
    location /api/export/ {
        limit_req zone=scrappy_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Resto de la aplicación
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
