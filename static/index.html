<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once Caldas - Estadísticas 2024</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .year-selector {
            background: white;
            color: #667eea;
            border: 2px solid white;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            outline: none;
        }

        .year-selector:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease-in;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
            transition: background-color 0.2s;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 25px 15px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5em;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .hidden {
            display: none;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .badge-gold {
            background: #ffd700;
            color: #333;
        }

        .badge-win {
            background: #4caf50;
            color: white;
        }

        .badge-loss {
            background: #f44336;
            color: white;
        }

        .badge-draw {
            background: #ff9800;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Once Caldas</h1>
            <p id="headerSubtitle">Estadísticas Temporada - Colombian Primera A</p>
        </div>

        <div class="controls">
            <select class="year-selector" id="yearSelector" onchange="onYearChange()">
                <option value="">Seleccionar año...</option>
            </select>
            <button class="btn" onclick="loadData()" id="loadBtn">
                📊 Cargar Estadísticas
            </button>
            <button class="btn" onclick="exportCSV()" id="exportBtn">
                💾 Exportar CSV
            </button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Extrayendo datos de ESPN...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="summary" class="stats-summary hidden"></div>

        <div id="insightsContainer" class="section hidden" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 30px; border-radius: 15px; margin-bottom: 30px;">
            <h2 style="color: white;">💡 Insights para Apuestas</h2>
            <div id="insightsContent"></div>
        </div>

        <div id="estadisticasContainer"></div>
        <div id="resultadosContainer"></div>
    </div>

    <script>
        const normaliseText = (value = "") =>
            value
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");

        function findTable(tables, { titleKeywords = [], headerKeywords = [] } = {}) {
            const normalisedTitleKeywords = titleKeywords.map(normaliseText);
            const normalisedHeaderKeywords = headerKeywords.map(normaliseText);

            return tables.find((table) => {
                const tableTitle = normaliseText(table.title || "");
                if (
                    normalisedTitleKeywords.length > 0 &&
                    normalisedTitleKeywords.some((keyword) =>
                        tableTitle.includes(keyword)
                    )
                ) {
                    return true;
                }

                const tableHeaders = (table.headers || []).map((header) =>
                    normaliseText(header)
                );

                return (
                    normalisedHeaderKeywords.length > 0 &&
                    normalisedHeaderKeywords.some((keyword) =>
                        tableHeaders.some((header) => header.includes(keyword))
                    )
                );
            });
        }

        function renderTable(tableElement, tableData) {
            let thead = tableElement.querySelector("thead");
            let tbody = tableElement.querySelector("tbody");

            if (!thead) {
                thead = document.createElement("thead");
                tableElement.appendChild(thead);
            }
            if (!tbody) {
                tbody = document.createElement("tbody");
                tableElement.appendChild(tbody);
            }

            if (!tableData || !Array.isArray(tableData.rows) || tableData.rows.length === 0) {
                thead.innerHTML = "";
                tbody.innerHTML =
                    '<tr><td class="empty-state">No se encontraron datos disponibles.</td></tr>';
                return 0;
            }

            const columnCount = Math.max(
                tableData.headers?.length || 0,
                ...tableData.rows.map((row) => row.length)
            );

            const headers = Array.from({ length: columnCount }).map((_, idx) => {
                const header = tableData.headers?.[idx] || `Columna ${idx + 1}`;
                return `<th>${header}</th>`;
            });

            thead.innerHTML = `<tr>${headers.join("")}</tr>`;

            const bodyRows = tableData.rows
                .map((row) => {
                    const cells = Array.from({ length: columnCount }).map((_, idx) => {
                        const value = row[idx] || "";
                        return `<td>${value}</td>`;
                    });
                    return `<tr>${cells.join("")}</tr>`;
                })
                .join("");

            tbody.innerHTML = bodyRows;
            return tableData.rows.length;
        }

        function combineResultsTables(tables) {
            if (!tables || tables.length === 0) {
                return { headers: [], rows: [] };
            }

            const maxColumns = tables.reduce((max, table) => {
                const headerLength = table.headers?.length || 0;
                const rowLength = Math.max(
                    0,
                    ...table.rows.map((row) => row.length)
                );
                return Math.max(max, headerLength, rowLength);
            }, 0);

            const baseHeaders = Array.from({ length: maxColumns }).map((_, idx) => {
                const sourceTable = tables.find(
                    (table) => (table.headers?.[idx] || "").trim() !== ""
                );
                const header = sourceTable?.headers?.[idx];
                return header && header.trim() !== "" ? header : `Columna ${idx + 1}`;
            });

            const headers = ["Competencia", ...baseHeaders];
            const rows = [];

            tables.forEach((table) => {
                const context = table.title && table.title.trim() !== "" ? table.title : "-";
                table.rows.forEach((row) => {
                    const cells = Array.from({ length: maxColumns }).map(
                        (_, idx) => row[idx] || ""
                    );
                    if (cells.some((cell) => cell && cell.toString().trim() !== "")) {
                        rows.push([context, ...cells]);
                    }
                });
            });

            return { headers, rows };
        }

        function displaySummary({ totalGoleadores, totalAsistencias, totalResultados, totalTablas }) {
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <div class="stat-card">
                    <h3>📊 Estadísticas</h3>
                    <div class="number">${totalTablas || 0}</div>
                    <p style="font-size: 0.9em; margin-top: 10px; color: #666;">categorías</p>
                </div>
    
                <div class="stat-card">
                    <h3>📅 Partidos</h3>
                    <div class="number">${totalResultados}</div>
                    <p style="font-size: 0.9em; margin-top: 10px; color: #666;">registrados</p>
                </div>
            `;
            summary.classList.remove('hidden');
        }

        let selectedYear = new Date().getFullYear();

        async function loadAvailableYears() {
            try {
                const response = await fetch('/api/years');
                const result = await response.json();

                if (result.success) {
                    const yearSelector = document.getElementById('yearSelector');
                    yearSelector.innerHTML = '<option value="">Seleccionar año...</option>';

                    result.years.reverse().forEach(year => {
                        const option = document.createElement('option');
                        option.value = year;
                        option.textContent = year;
                        if (year === result.current_year) {
                            option.selected = true;
                            selectedYear = year;
                        }
                        yearSelector.appendChild(option);
                    });

                    updateHeaderSubtitle(selectedYear);
                }
            } catch (e) {
                console.error('Error cargando años:', e);
            }
        }

        function onYearChange() {
            const yearSelector = document.getElementById('yearSelector');
            selectedYear = parseInt(yearSelector.value);
            updateHeaderSubtitle(selectedYear);
        }

        function updateHeaderSubtitle(year) {
            const subtitle = document.getElementById('headerSubtitle');
            if (year) {
                subtitle.textContent = `Estadísticas Temporada ${year} - Colombian Primera A`;
            }
        }

        async function loadData() {
            const loadBtn = document.getElementById('loadBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            if (!selectedYear) {
                showError('Por favor selecciona un año');
                return;
            }

            loadBtn.classList.add('loading');
            loadBtn.textContent = '⏳ Cargando...';
            loading.classList.remove('hidden');
            error.classList.add('hidden');

            try {
                const response = await fetch(`/api/scrape?year=${selectedYear}`);
                const result = await response.json();

                if (result.success) {
                    const metrics = displayData(result.data);
                    displaySummary(metrics);
                } else {
                    showError('Error: ' + result.error);
                }
            } catch (e) {
                showError('Error al conectar con el servidor: ' + e.message);
            } finally {
                loadBtn.classList.remove('loading');
                loadBtn.textContent = '📊 Cargar Estadísticas';
                loading.classList.add('hidden');
            }
        }

        function getTableIcon(headers) {
            const headersStr = headers.join(' ').toLowerCase();
            if (headersStr.includes('gol') || headers.includes('G')) return '⚽';
            if (headersStr.includes('asist') || headers.includes('A')) return '🎯';
            if (headersStr.includes('tarjeta') || headersStr.includes('tj')) return '🟨';
            if (headersStr.includes('falta')) return '⚠️';
            if (headersStr.includes('tiro')) return '🎯';
            return '📊';
        }

        function getTableTitle(table, index) {
            if (table.title) return table.title;

            const headers = table.headers || [];
            if (headers.includes('G') && !headers.includes('A')) return 'Goleadores';
            if (headers.includes('A')) return 'Asistencias';
            if (headers.some(h => h.toLowerCase().includes('tarjeta'))) return 'Tarjetas';
            if (headers.some(h => h.toLowerCase().includes('falta'))) return 'Faltas';

            return `Estadística ${index + 1}`;
        }

        function displayData(data) {
            const estadisticas = Array.isArray(data.estadisticas) ? data.estadisticas : [];
            const resultados = Array.isArray(data.resultados) ? data.resultados : [];

            const estadisticasContainer = document.getElementById('estadisticasContainer');
            const resultadosContainer = document.getElementById('resultadosContainer');

            estadisticasContainer.innerHTML = '';
            resultadosContainer.innerHTML = '';

            let totalGoleadores = 0;
            let totalAsistencias = 0;
            let totalResultados = 0;

            estadisticas.forEach((tableData, index) => {
                const section = document.createElement('div');
                section.className = 'section';

                const title = getTableTitle(tableData, index);
                const icon = getTableIcon(tableData.headers || []);

                const table = document.createElement('table');
                table.id = `statsTable${index}`;

                section.innerHTML = `<h2>${icon} ${title}</h2>`;
                section.appendChild(table);

                const rowCount = renderTable(table, tableData);

                console.log(`Tabla: "${title}" - Filas: ${rowCount}`);

                if (title.toLowerCase().includes('goleador')) {
                    console.log('  -> Es tabla de goleadores');
                    totalGoleadores = rowCount;
                }
                if (title.toLowerCase().includes('asistencia')) {
                    console.log('  -> Es tabla de asistencias');
                    totalAsistencias = rowCount;
                }

                estadisticasContainer.appendChild(section);
            });

            if (resultados.length > 0) {
                const section = document.createElement('div');
                section.className = 'section';

                const table = document.createElement('table');
                table.id = 'resultadosTable';

                section.innerHTML = '<h2>📅 Resultados</h2>';
                section.appendChild(table);

                const resultadosTableData = combineResultsTables(resultados);
                totalResultados = renderTable(table, resultadosTableData);

                resultadosContainer.appendChild(section);
            }

            generateInsights(estadisticas, resultados);

            console.log('Metrics:', {
                totalGoleadores,
                totalAsistencias,
                totalResultados,
                totalTablas: estadisticas.length
            });

            return {
                totalGoleadores,
                totalAsistencias,
                totalResultados,
                totalTablas: estadisticas.length
            };
        }

        function generateInsights(estadisticas, resultados) {
            const insightsContainer = document.getElementById('insightsContainer');
            const insightsContent = document.getElementById('insightsContent');

            const insights = [];

            const goleadoresTable = estadisticas.find(t => t.headers && t.headers.includes('G'));
            if (goleadoresTable && goleadoresTable.rows.length > 0) {
                const topScorer = goleadoresTable.rows[0];
                if (topScorer.length >= 4) {
                    const nombre = topScorer[1];
                    const goles = topScorer[3];
                    insights.push(`⚽ <strong>${nombre}</strong> lidera la tabla de goleadores con <strong>${goles} goles</strong>`);
                }
            }

            const asistenciasTable = estadisticas.find(t => t.headers && t.headers.includes('A'));
            if (asistenciasTable && asistenciasTable.rows.length > 0) {
                const topAssist = asistenciasTable.rows[0];
                if (topAssist.length >= 4) {
                    const nombre = topAssist[1];
                    const asistencias = topAssist[3];
                    insights.push(`🎯 <strong>${nombre}</strong> lidera en asistencias con <strong>${asistencias}</strong>`);
                }
            }

            if (resultados.length > 0) {
                const allResults = resultados.flatMap(t => t.rows || []);
                const wins = allResults.filter(r => {
                    const result = r.join(' ');
                    return result.includes('Once Caldas') && (result.match(/(\d+)\s*-\s*(\d+)/)?.[1] > result.match(/(\d+)\s*-\s*(\d+)/)?.[2]);
                }).length;

                if (allResults.length > 0) {
                    const winRate = ((wins / allResults.length) * 100).toFixed(1);
                    insights.push(`📊 Efectividad: <strong>${wins} victorias</strong> de <strong>${allResults.length} partidos</strong> (<strong>${winRate}%</strong>)`);
                }
            }

            if (insights.length > 0) {
                insightsContent.innerHTML = insights.map(i => `<p style="margin: 10px 0; font-size: 1.1em;">• ${i}</p>`).join('');
                insightsContainer.classList.remove('hidden');
            }
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.remove('hidden');
        }

        async function exportCSV() {
            const exportBtn = document.getElementById('exportBtn');
            if (exportBtn.classList.contains('loading')) {
                return;
            }

            if (!selectedYear) {
                showError('Por favor selecciona un año');
                return;
            }

            exportBtn.classList.add('loading');
            exportBtn.textContent = '⏳ Exportando...';

            try {
                const response = await fetch(`/api/export/csv?year=${selectedYear}`);

                if (!response.ok) {
                    throw new Error(`El servidor respondió con ${response.status}`);
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const timestamp = new Date()
                    .toISOString()
                    .replace(/[-:T]/g, '')
                    .split('.')[0];
                const filename = `once_caldas_${timestamp}.zip`;

                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(downloadUrl);

                alert('✅ Exportación completada. Se descargó un archivo ZIP con los CSV.');
            } catch (e) {
                alert('❌ Error al exportar: ' + e.message);
            } finally {
                exportBtn.classList.remove('loading');
                exportBtn.textContent = '💾 Exportar CSV';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAvailableYears();
        });
    </script>
</body>
</html>
